---
# The TLS fixtures are split between the control machine and the target.
#
# Control machine (first play):
#   Generates a test CA, a server certificate, a client certificate, and a
#   self-signed client certificate in `tls_src_dir`, defined once in
#   molecule.yml. The CA private key stays here.
#
# Target (second play):
#   Uploads the client files that the verify tests pass to psql into
#   /root/tls-client. That directory belongs to the test, not to the role.
#
# Nothing in prepare writes to /etc/postgresql/tls. The role creates that
# directory and uploads the server certificate, the server key, and the CA
# certificate from `tls_src_dir` during converge, the same way the production
# playbooks do. A passing test therefore proves the role's upload, not the
# fixture's.

- name: Generate TLS certificates on the control machine
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: Include TLS certificate generation tasks
      include_tasks: tasks/certificates.yml

- name: Upload the client TLS files for the verify tests
  hosts: all
  become: true

  tasks:
    - name: Create the client TLS directory
      file:
        path: /root/tls-client
        state: directory
        owner: root
        group: root
        mode: "0700"

    # psql runs as root in verify. libpq requires a private key owned by the
    # current user to have mode 0600.
    - name: Upload the client certificates and keys
      copy:
        src: "{{ tls_src_dir }}/{{ item.name }}"
        dest: "/root/tls-client/{{ item.name }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { name: ca.crt, mode: "0644" }
        - { name: client.crt, mode: "0644" }
        - { name: client.key, mode: "0600" }
        - { name: invalid-client.crt, mode: "0644" }
        - { name: invalid-client.key, mode: "0600" }
