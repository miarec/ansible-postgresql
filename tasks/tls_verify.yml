# file: postgresql/tasks/tls_verify.yml
#
# Verify that the PostgreSQL service user can read the TLS files. A file that
# the server cannot open fails the play here, before postgresql.conf is
# written with `ssl = on`, instead of failing the service at its next restart.
#
# The check runs as postgresql_service_user, the identity the service runs
# as. runuser applies the user's supplementary groups, as systemd does, so
# the check also proves the membership in postgresql_service_group. `test -r`
# covers traversal of every directory and read permission on the file
# itself, for files the role uploaded and files that arrived by other means.
#
# `select` drops the empty paths, for the optional CA, CRL, and DH files.

- name: PostgreSQL | Verify the service user can read the TLS files
  command: runuser -u {{ postgresql_service_user | quote }} -- test -r {{ item | quote }}
  loop: "{{ _postgresql_tls_paths | select | unique }}"
  loop_control:
    label: "{{ postgresql_service_user }} can read {{ item }}"
  vars:
    _postgresql_tls_paths:
      - "{{ postgresql_ssl_cert_file }}"
      - "{{ postgresql_ssl_key_file }}"
      - "{{ postgresql_ssl_ca_file }}"
      - "{{ postgresql_ssl_crl_file }}"
      - "{{ postgresql_ssl_dh_params_file }}"
  changed_when: false
