# file: postgresql/tasks/main.yml

- include_vars: "{{ item }}"
  with_first_found:
    - "../vars/{{ ansible_facts['os_family'] }}_{{ ansible_facts['distribution_major_version'] }}.yml"
    - "../vars/{{ ansible_facts['os_family'] }}.yml"
    - "../vars/empty.yml"
  tags: [always]

#
# Override defaults/main.yml with PostgreSQL version specific values
#
- include_vars: "{{ item }}"
  with_first_found:
    - "../vars/postgresql_{{ postgresql_version }}.yml"
    - "../vars/empty.yml"
  tags: [always]

- name: PostgreSQL | Collect supported major versions
  set_fact:
    postgresql_supported_versions: "{{ query('fileglob', role_path ~ '/templates/postgresql.conf-*.j2') | map('basename') | map('regex_replace', 'postgresql.conf-(\\d+)\\.j2', '\\1') | list }}"
  tags: [always]

- name: PostgreSQL | Ensure requested version is supported
  assert:
    that:
      - (postgresql_version | string) in postgresql_supported_versions
    fail_msg: "postgresql_version {{ postgresql_version }} lacks templates or vars. Supported versions: {{ postgresql_supported_versions | join(', ') }}"
  tags: [always]

- import_tasks: install_apt.yml
  when: ansible_facts['pkg_mgr'] == "apt"
  tags: [postgresql, postgresql-install]

- import_tasks: install_rhel.yml
  when: ansible_facts['os_family'] == "RedHat" and ansible_facts['distribution'] != "Fedora"

- import_tasks: install_fedora.yml
  when: ansible_facts['distribution'] == "Fedora"
  tags: [postgresql, postgresql-install]

- import_tasks: extensions.yml
  tags: [postgresql, postgresql-extensions]

- import_tasks: fdw.yml
  tags: [postgresql, postgresql-fdw]

- import_tasks: configure.yml
  tags: [postgresql, postgresql-configure]

- import_tasks: users.yml
  tags: [postgresql, postgresql-users]

- import_tasks: databases.yml
  tags: [postgresql, postgresql-databases]

- import_tasks: schemas.yml
  tags: [postgresql, postgresql-schemas]

- import_tasks: users_privileges.yml
  tags: [postgresql, postgresql-users]

- import_tasks: monit.yml
  when: monit_protection is defined and monit_protection | bool
  tags: [postgresql, postgresql-monit]

- import_tasks: check_pg_version_mismatch.yml
  tags: [postgresql, postgresql-version-mismatch]
