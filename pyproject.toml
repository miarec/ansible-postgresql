[project]
name = "ansible-postgresql"
version = "0.1.0"
description = "Ansible role to install and configure PostgreSQL"
requires-python = ">=3.10"

[dependency-groups]
# Pin ansible to 9.x (ansible-core 2.16) because:
# - EL8 distros ship with Python 3.6 as system Python
# - ansible-core 2.17+ requires Python 3.7+ on managed nodes
# - The dnf module needs python3-dnf bindings (only available for system Python)
# This allows testing all distros (including EL8) with the same command.
#
# ansible-core 2.16 doesn't run on Python 3.14, and ansible-lint refuses to
# start with that pair. .python-version pins the interpreter uv picks, both
# locally and on the CI runners, which otherwise take the newest Python.
dev = [
    "ansible>=9.0,<10.0",
    "ansible-lint>=24.0",
    "molecule>=24.0",
    "molecule-plugins[docker]>=23.5",
    "pytest-testinfra>=10.0",
]

[tool.uv]
default-groups = ["dev"]
